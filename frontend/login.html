<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Student Records</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f7fb;
    }

    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1rem; }
    main { width: min(100%, 430px); }
    header { margin-bottom: 1.4rem; }
    .eyebrow { color: #5267d8; font-size: 0.78rem; font-weight: 750; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 2rem; letter-spacing: -0.04em; }
    header p:last-child, .note { color: #657087; line-height: 1.6; }
    .panel { padding: 1.5rem; border: 1px solid #e4e9f2; border-radius: 16px; background: #fff; box-shadow: 0 8px 28px rgb(31 48 86 / 5%); }
    h2 { margin: 0 0 1rem; font-size: 1.15rem; }
    form, label { display: grid; gap: 0.8rem; }
    label { gap: 0.4rem; color: #39445a; font-size: 0.9rem; font-weight: 650; }
    input { width: 100%; min-height: 44px; padding: 0.65rem 0.75rem; border: 1px solid #d8deea; border-radius: 9px; color: #172033; font: inherit; font-weight: 400; }
    input:focus { border-color: #5267d8; outline: 3px solid rgb(82 103 216 / 15%); }
    button { min-height: 42px; padding: 0.6rem 0.95rem; border: 1px solid transparent; border-radius: 9px; background: #5267d8; color: #fff; cursor: pointer; font: inherit; font-weight: 700; }
    button:hover { background: #4054c4; }
    button:focus-visible { outline: 3px solid rgb(82 103 216 / 28%); outline-offset: 2px; }
    .switch { margin: 1rem 0 0; color: #657087; text-align: center; }
    .switch button { min-height: auto; padding: 0; border: 0; background: none; color: #4054c4; }
    .switch button:hover { text-decoration: underline; }
    .status { min-height: 1.5rem; margin: 0.8rem 0 0; color: #5267d8; font-size: 0.9rem; }
    .status.error { color: #bd303b; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Student management</p>
      <h1>Student records</h1>
      <p>Sign in to manage student information.</p>
    </header>

    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading">Sign in</h2>
      <form id="login-form">
        <label>Username
          <input name="username" autocomplete="username" minlength="3" maxlength="80" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" maxlength="128" required>
        </label>
        <button type="submit">Sign in</button>
      </form>
      <form id="register-form" hidden>
        <label>Username
          <input name="username" autocomplete="username" minlength="3" maxlength="80" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
        </label>
        <button type="submit">Create account</button>
      </form>
      <p class="switch">
        <span id="switch-prompt">New here?</span>
        <button id="switch-form" type="button">Create an account</button>
      </p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const loginForm = document.querySelector("#login-form");
    const registerForm = document.querySelector("#register-form");
    const formHeading = document.querySelector("#form-heading");
    const switchPrompt = document.querySelector("#switch-prompt");
    const switchForm = document.querySelector("#switch-form");
    const status = document.querySelector("#status");

    function showStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    async function submitAuth(endpoint, form) {
      const values = Object.fromEntries(new FormData(form).entries());
      showStatus(endpoint === "/auth/login" ? "Signing in..." : "Creating your account...");
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(values)
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.detail || `Request failed (${response.status})`);
        }
        window.location.replace("/");
      } catch (error) {
        showStatus(error.message, true);
      }
    }

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      submitAuth("/auth/login", loginForm);
    });

    registerForm.addEventListener("submit", (event) => {
      event.preventDefault();
      submitAuth("/auth/register", registerForm);
    });

    switchForm.addEventListener("click", () => {
      const registering = registerForm.hidden;
      loginForm.hidden = registering;
      registerForm.hidden = !registering;
      formHeading.textContent = registering ? "Create account" : "Sign in";
      switchPrompt.textContent = registering ? "Already registered?" : "New here?";
      switchForm.textContent = registering ? "Sign in" : "Create an account";
      showStatus("");
    });

    fetch("/auth/me").then((response) => {
      if (response.ok) {
        window.location.replace("/");
      } else if (response.status !== 401) {
        showStatus("Could not check your sign-in status.", true);
      }
    }).catch(() => {
      showStatus("Could not connect to the server.", true);
    });
  </script>
</body>
</html>
